    // ═══════════════════════════════════════════════════════════════
    function makeDB(url, key) {
      let tok = key, uid = null, userEmail = null;
      const H = () => ({ apikey: key, Authorization: `Bearer ${tok}`, "Content-Type": "application/json", Prefer: "return=representation" });
      const go = async (method, table, body, qs = "") => {
        try {
          const r = await fetch(`${url}/rest/v1/${table}${qs}`, { method, headers: H(), body: body ? JSON.stringify(body) : undefined });
          if (r.status === 204) return [null, null];
          const d = await r.json();
          if (!r.ok) return [null, d.message || d.msg || d.error || "Error"];
          return [Array.isArray(d) ? d : [d], null];
        } catch (e) { return [null, e.message]; }
      };
      return {
        uid: () => uid, email: () => userEmail,
        auth: {
          login: async (email, pw) => {
            try {
              const r = await fetch(`${url}/auth/v1/token?grant_type=password`, { method:"POST", headers:{apikey:key,"Content-Type":"application/json"}, body:JSON.stringify({email,password:pw}) });
              const d = await r.json();
              if (d.access_token) { tok=d.access_token; uid=d.user?.id; userEmail=d.user?.email; return [d.user,null]; }
              return [null, d.error_description||d.msg||"Credenciales incorrectas"];
            } catch(e) { return [null,e.message]; }
          },
          signup: async (email, pw, name) => {
            try {
              const r = await fetch(`${url}/auth/v1/signup`, { method:"POST", headers:{apikey:key,"Content-Type":"application/json"}, body:JSON.stringify({email,password:pw,data:{full_name:name}}) });
              const d = await r.json();
              if (d.id||d.identities) return [d,null];
              return [null, d.msg||d.message||"Error"];
            } catch(e) { return [null,e.message]; }
          },
          logout: () => { tok=key; uid=null; userEmail=null; },
        },
        props: {
          list: async () => {
            const [owned, err] = await go("GET","properties",null,`?owner_id=eq.${uid}&order=created_at.asc`);
            if (!userEmail) return [owned||[],err];
            const [memberships, membErr] = await go("GET","property_members",null,`?user_email=eq.${encodeURIComponent(userEmail)}`);
            if (membErr) return [owned||[],null];
            if (memberships?.length) {
              const ids = memberships.map(m=>m.property_id).join(",");
              const [shared] = await go("GET","properties",null,`?id=in.(${ids})&order=created_at.asc`);
              const all = [...(owned||[])];
              for (const p of (shared||[])) { if (!all.find(x=>x.id===p.id)) { const m=memberships.find(m=>m.property_id===p.id); all.push({...p,_shared:true,_role:m?.role}); } }
              return [all,null];
            }
            return [owned||[],err];
          },
          create: (data) => go("POST","properties",{...data,owner_id:uid}),
          update: (id,data) => go("PATCH","properties",data,`?id=eq.${id}`),
          del: (id) => go("DELETE","properties",null,`?id=eq.${id}`),
        },
        txns: {
          list: (ids) => ids?.length ? go("GET","transactions",null,`?property_id=in.(${ids.join(",")})&order=date.desc&limit=1000`) : Promise.resolve([[],null]),
          create: (data) => go("POST","transactions",data),
          update: (id,data) => go("PATCH","transactions",data,`?id=eq.${id}`),
          del: (id) => go("DELETE","transactions",null,`?id=eq.${id}`),
        },
        members: {
          list: (propId) => go("GET","property_members",null,`?property_id=eq.${propId}`),
          add: (data) => go("POST","property_members",data),
          remove: (id) => go("DELETE","property_members",null,`?id=eq.${id}`),
        },
      };
    }

    // ═══════════════════════════════════════════════════════════════
    // SVG BAR CHART — scrollable, up to 60 months
    // ═══════════════════════════════════════════════════════════════
    function SVGBarChart({ data, incLabel, expLabel }) {
      const [tooltip, setTooltip] = useState(null);
      const { displayCur } = useCur();
      const BAR_W = 14, BAR_GAP = 4, GROUP_GAP = 10;
      const H = 200, PT = 10, PB = 28, PL = 44, PR = 10;
      const iH = H - PT - PB;
      const groupW = BAR_W * 2 + BAR_GAP + GROUP_GAP;
      const W = Math.max(500, PL + PR + data.length * groupW);
      const maxVal = Math.max(...data.flatMap(d=>[d.inc,d.exp]), 1);
      const toY = v => PT + iH - (v / maxVal) * iH;
      const fK = v => v >= 1000 ? `${(v/1000).toFixed(0)}k` : String(Math.round(v));
      const startX = PL;

      return (
        <div style={{position:"relative"}}>
          <div className="chart-scroll">
            <svg viewBox={`0 0 ${W} ${H}`} style={{width:`${W}px`,height:"200px",minWidth:"100%",display:"block"}}>
              {[0,1,2,3,4].map(i => {
                const val = (maxVal/4)*i; const y = toY(val);
                return <g key={i}><line x1={PL} x2={W-PR} y1={y} y2={y} stroke="#1c1c2e" strokeDasharray="3 3"/><text x={PL-5} y={y+4} textAnchor="end" fill="#5a5a78" fontSize="10">{fK(val)}</text></g>;
              })}
              {data.map((d,i) => {
                const gx = startX + i * groupW;
                const h1 = Math.max((d.inc/maxVal)*iH,1), h2 = Math.max((d.exp/maxVal)*iH,1);
                const y1 = PT+iH-h1, y2 = PT+iH-h2;
                const cx = gx + BAR_W + BAR_GAP/2;
                const active = tooltip?.i===i;
                return (
                  <g key={i}>
                    <rect x={gx} y={y1} width={BAR_W} height={h1} rx="2" fill="#6ec99a" opacity={active?1:0.8} onMouseEnter={()=>setTooltip({i,d,cx})} onMouseLeave={()=>setTooltip(null)} style={{cursor:"default"}}/>
                    <rect x={gx+BAR_W+BAR_GAP} y={y2} width={BAR_W} height={h2} rx="2" fill="#d46b6b" opacity={active?1:0.8} onMouseEnter={()=>setTooltip({i,d,cx})} onMouseLeave={()=>setTooltip(null)} style={{cursor:"default"}}/>
                    <text x={cx} y={H-6} textAnchor="middle" fill="#5a5a78" fontSize={data.length > 24 ? "8" : "10"}>{d.name}</text>
                  </g>
                );
              })}
            </svg>
          </div>
          {tooltip && (
            <div style={{position:"absolute",pointerEvents:"none",left:`${Math.min(Math.max((tooltip.cx/W)*100,10),85)}%`,top:"10px",transform:"translateX(-50%)",background:"#10102a",border:"1px solid #1c1c2e",borderRadius:"8px",padding:"8px 12px",fontSize:"12px",color:"#e0e0ee",whiteSpace:"nowrap",zIndex:10,boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>
              <div style={{color:"#7070a0",marginBottom:"4px",fontWeight:"700"}}>{tooltip.d.name}</div>
              <div style={{color:"#6ec99a"}}>↑ {incLabel}: {fCur(tooltip.d.inc,displayCur)}</div>
              <div style={{color:"#d46b6b"}}>↓ {expLabel}: {fCur(tooltip.d.exp,displayCur)}</div>
            </div>
          )}
          <div style={{display:"flex",gap:"16px",justifyContent:"center",marginTop:"8px"}}>
            <span style={{color:"#7070a0",fontSize:"12px"}}><span style={{color:"#6ec99a"}}>■</span> {incLabel}</span>
            <span style={{color:"#7070a0",fontSize:"12px"}}><span style={{color:"#d46b6b"}}>■</span> {expLabel}</span>
          </div>
        </div>
      );
    }

      const submit = async () => {
        setErr(""); setInfo(""); setLoading(true);
        if (mode==="login") { const [user,error]=await db.auth.login(email,pw); if(error) setErr(error); else onLogin(user); }
        else { const [,error]=await db.auth.signup(email,pw,name); if(error) setErr(error); else { setInfo(t('check_email')); setMode("login"); } }

        <div style={{minHeight:"100vh",background:"#07070f",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>

              <div style={{width:"52px",height:"52px",borderRadius:"14px",background:"linear-gradient(135deg,#c9956e,#a06b3e)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"24px",margin:"0 auto 14px",boxShadow:"0 8px 30px #c9956e44"}}>🏠</div>
              <h1 style={{color:"#e0e0ee",fontSize:"26px",fontWeight:"900",margin:"0 0 6px",letterSpacing:"-0.03em"}}>RentaManager</h1>
              <p style={{color:"#5a5a78",margin:0,fontSize:"14px"}}>{mode==="login"?t('welcome_back'):t('create_account')}</p>
            </div>
            <div style={S.card}>

              <Field label={t('email')}><Inp type="email" placeholder="correo@ejemplo.com" value={email} onChange={e=>setEmail(e.target.value)}/></Field>
              <Field label={t('password')}><Inp type="password" placeholder="••••••••" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></Field>
              {err&&<p style={{color:"#d46b6b",fontSize:"13px",marginBottom:"12px"}}>{err}</p>}
              {info&&<p style={{color:"#6ec99a",fontSize:"13px",marginBottom:"12px"}}>{info}</p>}
              <Btn onClick={submit} disabled={loading} style={{width:"100%",padding:"12px"}}>{loading?t('loading'):mode==="login"?t('login'):t('register')}</Btn>
              <p style={{textAlign:"center",color:"#5a5a78",fontSize:"13px",margin:"16px 0 0"}}>
                {mode==="login"?t('no_account'):t('has_account')}{" "}
                <button onClick={()=>{setMode(mode==="login"?"signup":"login");setErr("");}} style={{background:"none",border:"none",color:"#c9956e",cursor:"pointer",fontSize:"13px",fontWeight:"700"}}>{mode==="login"?t('sign_up'):t('sign_in')}</button>
              </p>

      );

    function KPICard({label,value,icon,color,sub}) {

    function DashboardView({ properties, transactions, visibleIds, setVisibleIds, period, setPeriod, chartMonths, setChartMonths }) {
      const { t } = useLang();
      const { displayCur } = useCur();
      const [customInput, setCustomInput] = useState("");

      const visTxns = useMemo(()=>transactions.filter(tx=>visibleIds.includes(tx.property_id)),[transactions,visibleIds]);
      // FIX #1: periodTxns correctly filtered by period AND visibleIds
      const periodTxns = useMemo(()=>visTxns.filter(tx=>tx.date?.startsWith(period)),[visTxns,period]);

      const inc = periodTxns.filter(tx=>tx.type==="income").reduce((s,tx)=>s+convertCur(tx.amount,tx.currency||'EUR',displayCur),0);
      const exp = periodTxns.filter(tx=>tx.type==="expense").reduce((s,tx)=>s+convertCur(tx.amount,tx.currency||'EUR',displayCur),0);

      // FIX #2: chart uses period as end point, supports up to 60 months
      const chartData = useMemo(()=>{
        const [py,pm] = period.split("-").map(Number);
        return Array.from({length:chartMonths},(_,i)=>{
          const offset = chartMonths-1-i;
          let m = pm-offset, y = py;
          while(m<=0){m+=12;y--;} while(m>12){m-=12;y++;}
          const key = `${y}-${String(m).padStart(2,"0")}`;
          const mTxns = visTxns.filter(tx=>tx.date?.startsWith(key));
          return {
            name: chartMonths > 24 ? `${t('months')[m-1]}'${String(y).slice(2)}` : (chartMonths > 12 ? `${t('months')[m-1]} ${y}` : t('months')[m-1]),
            inc: mTxns.filter(tx=>tx.type==="income").reduce((s,tx)=>s+convertCur(tx.amount,tx.currency||'EUR',displayCur),0),
            exp: mTxns.filter(tx=>tx.type==="expense").reduce((s,tx)=>s+convertCur(tx.amount,tx.currency||'EUR',displayCur),0),
          };
        });
      },[visTxns,period,chartMonths,displayCur,t]);

      // Category breakdown — amounts converted to displayCur before summing
      const incGroups = useMemo(()=>{
        const m={};
        periodTxns.filter(tx=>tx.type==="income").forEach(tx=>{ const k=tx.category||t('no_cat'); m[k]=(m[k]||0)+convertCur(tx.amount,tx.currency||'EUR',displayCur); });
        return Object.entries(m).sort((a,b)=>b[1]-a[1]);
      },[periodTxns,t,displayCur]);
      const expGroups = useMemo(()=>{
        const m={};
        periodTxns.filter(tx=>tx.type==="expense").forEach(tx=>{ const k=tx.category||t('no_cat'); m[k]=(m[k]||0)+convertCur(tx.amount,tx.currency||'EUR',displayCur); });
        return Object.entries(m).sort((a,b)=>b[1]-a[1]);
      },[periodTxns,t,displayCur]);
      const totalInc = incGroups.reduce((s,[,v])=>s+v,0);
      const totalExp = expGroups.reduce((s,[,v])=>s+v,0);

      const fDisp = useDisplayCur();
      const toggleProp = (id) => setVisibleIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);

      const applyCustomMonths = () => {
        const n = parseInt(customInput);
        if (n >= 1 && n <= 60) { setChartMonths(n); setCustomInput(""); }
      };

      const presets = [3,6,12,24,60];

      return (
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"18px",flexWrap:"wrap",gap:"10px"}}>
            <h2 style={{margin:0,color:"#e0e0ee",fontSize:"22px",fontWeight:"900",letterSpacing:"-0.02em"}}>{t('dashboard')}</h2>
            <input type="month" value={period} onChange={e=>setPeriod(e.target.value)} style={{...S.input,width:"164px",padding:"8px 12px"}}/>
          </div>

          <div className="filter-scroll" style={{marginBottom:"18px"}}>
            {properties.map(p=>{
              const on=visibleIds.includes(p.id);
              return <button key={p.id} onClick={()=>toggleProp(p.id)} style={{padding:"6px 14px",borderRadius:"20px",whiteSpace:"nowrap",border:`1.5px solid ${on?p.color:"#1c1c2e"}`,background:on?p.color+"18":"transparent",color:on?p.color:"#4a4a68",cursor:"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"inherit",transition:"all 0.15s"}}>● {p.name}{p._shared?` (${t('shared_label')})`:''}</button>;
            })}
          </div>

          <div style={{display:"flex",gap:"12px",marginBottom:"16px",flexWrap:"wrap"}}>
            <KPICard label={t('income')} value={fCur(inc,displayCur)} icon="💰" color="#6ec99a" sub={`${periodTxns.filter(tx=>tx.type==="income").length} ${t('entries')}`}/>
            <KPICard label={t('expenses')} value={fCur(exp,displayCur)} icon="🧾" color="#d46b6b" sub={`${periodTxns.filter(tx=>tx.type==="expense").length} ${t('exits')}`}/>
            <KPICard label={t('net_profit')} value={fCur(inc-exp,displayCur)} icon="📊" color="#a06bd4"/>
          </div>

          {/* Chart with month selector */}
          <div style={{...S.card,marginBottom:"16px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"10px"}}>
              <h3 style={{margin:0,color:"#e0e0ee",fontSize:"14px",fontWeight:"800"}}>{t('months_label')}</h3>
              <div style={{display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap"}}>
                {presets.map(n=>(
                  <button key={n} onClick={()=>setChartMonths(n)} style={{padding:"4px 10px",borderRadius:"6px",border:"none",cursor:"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"inherit",background:chartMonths===n&&!customInput?"#c9956e":"#1c1c2e",color:chartMonths===n&&!customInput?"#07070e":"#5a5a78",transition:"all 0.15s"}}>{n}</button>
                ))}
                <div style={{display:"flex",gap:"4px",alignItems:"center"}}>
                  <input type="number" min="1" max="60" placeholder={t('custom_months')} value={customInput} onChange={e=>setCustomInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&applyCustomMonths()}
                    style={{...S.input,width:"100px",padding:"4px 8px",fontSize:"12px"}}/>
                  <button onClick={applyCustomMonths} style={{padding:"4px 10px",borderRadius:"6px",border:"none",cursor:"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"inherit",background:"#1c1c2e",color:"#5a5a78"}}>→</button>
                </div>
              </div>
            </div>
            <SVGBarChart data={chartData} incLabel={t('income')} expLabel={t('expenses')}/>
          </div>

          {/* Category breakdown — uses periodTxns (already filtered by month + visibleIds) */}
          <div style={S.card}>
            <div style={{display:"flex",gap:"24px",flexWrap:"wrap"}}>
              {[
                {groups:incGroups,total:totalInc,color:"#6ec99a",label:t('income_by_cat')},
                {groups:expGroups,total:totalExp,color:"#d46b6b",label:t('expenses_by_cat')},
              ].map(({groups,total,color,label})=>(
                <div key={label} style={{flex:1,minWidth:"200px"}}>
                  <h4 style={{margin:"0 0 12px",color,fontSize:"12px",fontWeight:"800",textTransform:"uppercase",letterSpacing:"0.05em"}}>{label}</h4>
                  {groups.length===0&&<p style={{color:"#5a5a78",fontSize:"12px",margin:0}}>{t('no_data')}</p>}
                  {groups.map(([cat,amt])=>(
                    <div key={cat} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #13132a"}}>
                      <span style={{color:"#9090bb",fontSize:"12px",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",paddingRight:"8px"}}>{cat}</span>
                      <span style={{color,fontSize:"13px",fontWeight:"700",flexShrink:0}}>{fCur(amt,displayCur)}</span>
                    </div>
                  ))}
                  {groups.length>0&&(
                    <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0 0",marginTop:"4px"}}>
                      <span style={{color:"#e0e0ee",fontSize:"12px",fontWeight:"800",textTransform:"uppercase",letterSpacing:"0.04em"}}>{t('total')}</span>
                      <span style={{color,fontSize:"14px",fontWeight:"900"}}>{fCur(total,displayCur)}</span>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // MONTHLY SUMMARY VIEW  (#4 — new tab)
    // ═══════════════════════════════════════════════════════════════
    function MonthlyView({ properties, transactions, visibleIds, period, setPeriod }) {
      const { t } = useLang();
      const { displayCur } = useCur();
      const fDisp = useDisplayCur();

      const propMap = useMemo(()=>Object.fromEntries(properties.map(p=>[p.id,p])),[properties]);

      const periodTxns = useMemo(()=>
        transactions.filter(tx=>visibleIds.includes(tx.property_id)&&tx.date?.startsWith(period))
      ,[transactions,visibleIds,period]);

      const incTxns = periodTxns.filter(tx=>tx.type==="income").sort((a,b)=>a.date>b.date?1:-1);
      const expTxns = periodTxns.filter(tx=>tx.type==="expense").sort((a,b)=>a.date>b.date?1:-1);
      const totalInc = incTxns.reduce((s,tx)=>s+convertCur(tx.amount,tx.currency||'EUR',displayCur),0);
      const totalExp = expTxns.reduce((s,tx)=>s+convertCur(tx.amount,tx.currency||'EUR',displayCur),0);
      const profit = totalInc - totalExp;

      const [py,pm] = period.split("-").map(Number);
      const prevMonth = () => { let m=pm-1,y=py; if(m<1){m=12;y--;} setPeriod(`${y}-${String(m).padStart(2,"0")}`); };
      const nextMonth = () => { let m=pm+1,y=py; if(m>12){m=1;y++;} setPeriod(`${y}-${String(m).padStart(2,"0")}`); };
      const monthName = `${t('full_months')[pm-1]} ${py}`;

        const prop = propMap[tx.property_id];

    // ═══════════════════════════════════════════════════════════════
    // SHARE MODAL
    // ═══════════════════════════════════════════════════════════════
    function ShareModal({ prop, db, onClose }) {
      const { t } = useLang();
      const [members,setMembers] = useState([]);
      const [invEmail,setInvEmail] = useState(""); const [invRole,setInvRole] = useState("editor");
      const [loading,setLoading] = useState(false); const [err,setErr] = useState("");
      useEffect(()=>{ db.members.list(prop.id).then(([data])=>setMembers(data||[])); },[prop.id]);
      const invite = async () => {
        if(!invEmail.trim()) return;
        setLoading(true); setErr("");
        const [,error] = await db.members.add({property_id:prop.id,user_email:invEmail.trim().toLowerCase(),role:invRole,invited_by:db.uid()});
        if(error) setErr(error);
        else { setInvEmail(""); const [data]=await db.members.list(prop.id); setMembers(data||[]); }
        setLoading(false);
      };
      const remove = async (id) => { await db.members.remove(id); const [data]=await db.members.list(prop.id); setMembers(data||[]); };
      return (
        <Modal title={`${t('share_title')}: ${prop.name}`} onClose={onClose} width="460px">
          <Field label={t('invite_email')}><Inp type="email" placeholder="email@ejemplo.com" value={invEmail} onChange={e=>setInvEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&invite()}/></Field>
          <Field label={t('invite_role')}><Sel value={invRole} onChange={e=>setInvRole(e.target.value)}><option value="editor">{t('role_editor')}</option><option value="viewer">{t('role_viewer')}</option></Sel></Field>
          {err&&<p style={{color:"#d46b6b",fontSize:"13px",marginBottom:"10px"}}>{err}</p>}
          <Btn onClick={invite} disabled={loading||!invEmail.trim()} style={{width:"100%",marginBottom:"20px"}}>{loading?t('loading'):t('invite')}</Btn>
          <h4 style={{...S.label,marginBottom:"10px"}}>{t('current_members')}</h4>
          <div style={{marginBottom:"12px",padding:"10px 12px",background:"#080812",borderRadius:"8px",display:"flex",justifyContent:"space-between"}}><span style={{color:"#7070a0",fontSize:"13px"}}>{db.email()}</span><Badge color="#c9956e" small>{t('owner_label')}</Badge></div>
          {members.map(m=>(
            <div key={m.id} style={{padding:"10px 12px",background:"#080812",borderRadius:"8px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
              <span style={{color:"#7070a0",fontSize:"13px",flex:1,overflow:"hidden",textOverflow:"ellipsis"}}>{m.user_email}</span>
              <div style={{display:"flex",gap:"8px",alignItems:"center"}}><Badge color={m.role==="editor"?"#6b9fd4":"#5a5a78"} small>{m.role}</Badge><button onClick={()=>remove(m.id)} style={{background:"none",border:"none",color:"#d46b6b88",cursor:"pointer",fontSize:"14px",padding:"2px"}}>✕</button></div>
            </div>
          ))}
          {members.length===0&&<p style={{color:"#5a5a78",fontSize:"12px",margin:0}}>—</p>}
        </Modal>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // TRANSACTION MODAL — with bulk (#5)
    // ═══════════════════════════════════════════════════════════════
    function TxnModal({ txn, properties, onSave, onSaveBulk, onClose }) {
      const { t } = useLang();
      const isEdit = !!txn?.id;
      const defaultProp = properties[0];
      const [bulk, setBulk] = useState(false);
      const [bulkMonths, setBulkMonths] = useState([]);
      const [bulkYear, setBulkYear] = useState(new Date().getFullYear());
      const [creating, setCreating] = useState(false);
      const [dupIncome, setDupIncome] = useState(false);
      const [dupStatus, setDupStatus] = useState("pending");
      const [form,setForm] = useState({type:"income",property_id:defaultProp?.id||"",category:"",amount:"",currency:defaultProp?.currency||"EUR",date:new Date().toISOString().split("T")[0],description:"",platform:"",check_in:"",check_out:"",payment_status:"paid",notes:"",...txn});
      const set = (k,v) => setForm(f=>({...f,[k]:v}));
      const prop = properties.find(p=>p.id===form.property_id);
      const cats = form.type==="income"?(prop?.type==="short-term"?t('inc_short'):t('inc_long')):t('exp_cats');
      const monthNames = t('months');

      // Only show dup toggle for expenses on long-term properties
      const showDupToggle = !isEdit && form.type==="expense" && prop?.type==="long-term";

      const toggleMonth = (m) => setBulkMonths(prev=>prev.includes(m)?prev.filter(x=>x!==m):[...prev,m]);

      const handleSave = async () => {
        if (bulk && bulkMonths.length > 0) {
          setCreating(true);
          await onSaveBulk(form, bulkMonths, bulkYear, dupIncome ? dupStatus : null);
          setCreating(false);
        } else {
          onSave(form, dupIncome ? dupStatus : null);
        }
      };

      return (
        <Modal title={isEdit?t('edit_txn_title'):bulk?t('bulk_title'):t('new_txn_title')} onClose={onClose} width="560px">
          {!isEdit && (
            <div style={{marginBottom:"16px",display:"flex",flexWrap:"wrap",gap:"10px"}}>
              <button onClick={()=>{setBulk(b=>!b);setBulkMonths([]);}} style={{display:"flex",alignItems:"center",gap:"8px",background:"none",border:"none",cursor:"pointer",padding:0,fontFamily:"inherit"}}>
                <div style={{width:"20px",height:"20px",borderRadius:"5px",background:bulk?"#c9956e":"transparent",border:`2px solid ${bulk?"#c9956e":"#3a3a58"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",flexShrink:0,transition:"all 0.15s"}}>{bulk?"✓":""}</div>
                <span style={{color:bulk?"#c9956e":"#5a5a78",fontSize:"13px",fontWeight:"700"}}>{t('bulk_toggle')}</span>
              </button>
            </div>
          )}

          {/* Duplicate as income — only for long-term expenses */}
          {showDupToggle && (
            <div style={{marginBottom:"16px",padding:"12px 14px",background:"#6ec99a0d",border:"1px solid #6ec99a22",borderRadius:"10px"}}>
              <button onClick={()=>setDupIncome(d=>!d)} style={{display:"flex",alignItems:"center",gap:"8px",background:"none",border:"none",cursor:"pointer",padding:0,fontFamily:"inherit",width:"100%"}}>
                <div style={{width:"20px",height:"20px",borderRadius:"5px",background:dupIncome?"#6ec99a":"transparent",border:`2px solid ${dupIncome?"#6ec99a":"#3a3a58"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",flexShrink:0,transition:"all 0.15s",color:"#07070e"}}>{dupIncome?"✓":""}</div>
                <span style={{color:dupIncome?"#6ec99a":"#5a5a78",fontSize:"13px",fontWeight:"700"}}>{t('dup_toggle')}</span>
              </button>
              {dupIncome && (
                <div style={{marginTop:"12px"}}>
                  <label style={S.label}>{t('dup_status')}</label>
                  <Sel value={dupStatus} onChange={e=>setDupStatus(e.target.value)}>
                    <option value="paid">{t('paid')}</option>
                    <option value="pending">{t('pending_opt')}</option>
                    <option value="overdue">{t('overdue_opt')}</option>
                  </Sel>
                  <p style={{color:"#5a5a78",fontSize:"11px",margin:"8px 0 0",lineHeight:"1.5"}}>💡 {t('dup_note')}</p>
                </div>
              )}
            </div>
          )}

          <Row>
            <Field label={t('type')} half><Sel value={form.type} onChange={e=>{set("type",e.target.value);set("category","");}}><option value="income">{t('inc_type')}</option><option value="expense">{t('exp_type')}</option></Sel></Field>
            <Field label={t('property')} half><Sel value={form.property_id} onChange={e=>{const p=properties.find(x=>x.id===e.target.value);set("property_id",e.target.value);set("currency",p?.currency||"EUR");}}>{properties.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</Sel></Field>
          </Row>
          <Row>
            <Field label={t('category')} half><Sel value={form.category} onChange={e=>set("category",e.target.value)}><option value="">{t('sel_cat')}</option>{cats.map(c=><option key={c}>{c}</option>)}</Sel></Field>
            <Field label={t('pay_status')} half><Sel value={form.payment_status} onChange={e=>set("payment_status",e.target.value)}><option value="paid">{t('paid')}</option><option value="pending">{t('pending_opt')}</option><option value="overdue">{t('overdue_opt')}</option></Sel></Field>
          </Row>
          <Row>
            <Field label={t('amount')} half><Inp type="number" placeholder="0.00" min="0" step="0.01" value={form.amount} onChange={e=>set("amount",e.target.value)}/></Field>
            <Field label={t('currency')} half><Sel value={form.currency} onChange={e=>set("currency",e.target.value)}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</Sel></Field>
          </Row>

          {/* Bulk month selector OR single date */}
          {bulk && !isEdit ? (
            <Field label={`${t('bulk_select_months')} — ${bulkYear}`}>
              <div style={{display:"flex",gap:"6px",marginBottom:"10px"}}>
                {[new Date().getFullYear()-1, new Date().getFullYear(), new Date().getFullYear()+1].map(y=>(
                  <button key={y} onClick={()=>setBulkYear(y)} style={{flex:1,padding:"5px",borderRadius:"6px",border:"none",cursor:"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"inherit",background:bulkYear===y?"#c9956e":"#1c1c2e",color:bulkYear===y?"#07070e":"#5a5a78"}}>{y}</button>
                ))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"6px"}}>
                {monthNames.map((mn,i)=>{
                  const on = bulkMonths.includes(i+1);
                  return <button key={i} onClick={()=>toggleMonth(i+1)} style={{padding:"7px 4px",borderRadius:"7px",border:`1.5px solid ${on?"#c9956e":"#1c1c2e"}`,background:on?"#c9956e18":"transparent",color:on?"#c9956e":"#5a5a78",cursor:"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"inherit",transition:"all 0.15s"}}>{mn}</button>;
                })}
              </div>
              {bulkMonths.length>0&&<p style={{color:"#7070a0",fontSize:"11px",marginTop:"8px"}}>{t('bulk_hint')} ({bulkMonths.length} meses)</p>}
            </Field>
          ) : (
            <Field label={t('date')}><Inp type="date" value={form.date} onChange={e=>set("date",e.target.value)}/></Field>
          )}

          <Field label={t('desc_opt')}><Inp placeholder={t('desc_opt')} value={form.description} onChange={e=>set("description",e.target.value)}/></Field>
          {prop?.type==="short-term"&&form.type==="income"&&(
            <>
              <Field label={t('platform')}><Sel value={form.platform} onChange={e=>set("platform",e.target.value)}><option value="">{t('select_direct')}</option><option>{t('airbnb')}</option><option>{t('booking')}</option><option>{t('direct')}</option><option>{t('other')}</option></Sel></Field>
              <Row><Field label={t('check_in')} half><Inp type="date" value={form.check_in} onChange={e=>set("check_in",e.target.value)}/></Field><Field label={t('check_out')} half><Inp type="date" value={form.check_out} onChange={e=>set("check_out",e.target.value)}/></Field></Row>
            </>
          )}
          <Field label={t('notes_opt')}><Inp placeholder={t('notes_opt')} value={form.notes} onChange={e=>set("notes",e.target.value)}/></Field>
          <div style={{display:"flex",gap:"10px",justifyContent:"flex-end",marginTop:"4px"}}>
            <Btn variant="ghost" onClick={onClose}>{t('cancel')}</Btn>
            <Btn onClick={handleSave} disabled={creating||!form.amount||!form.property_id||(bulk&&bulkMonths.length===0&&!isEdit)}>
              {creating?t('creating'):bulk&&!isEdit?`${t('save_bulk')} (${bulkMonths.length})`:t('save_txn')}
            </Btn>
          </div>
        </Modal>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // TRANSACTIONS VIEW — persistent filters + clear + badge position (#3,#6)
    // ═══════════════════════════════════════════════════════════════
    function TransactionsView({ transactions, properties, filters, setFilters, onAdd, onEdit, onDelete }) {
      const { t } = useLang();
      const { displayCur } = useCur();
      const propMap = useMemo(()=>Object.fromEntries(properties.map(p=>[p.id,p])),[properties]);

      const {fProp,fType,fMonth,fStatus,search} = filters;
      const set = (k,v) => setFilters(f=>({...f,[k]:v}));
      const clearFilters = () => setFilters({fProp:"all",fType:"all",fMonth:"",fStatus:"all",search:""});
      const hasFilters = fProp!=="all"||fType!=="all"||fMonth||fStatus!=="all"||search;

      const filtered = useMemo(()=>transactions.filter(tx=>{
        if(fProp!=="all"&&tx.property_id!==fProp) return false;
        if(fType!=="all"&&tx.type!==fType) return false;
        if(fMonth&&!tx.date?.startsWith(fMonth)) return false;
        if(fStatus!=="all"&&tx.payment_status!==fStatus) return false;
        if(search){const s=search.toLowerCase();if(!(tx.category||"").toLowerCase().includes(s)&&!(tx.description||"").toLowerCase().includes(s)&&!(tx.platform||"").toLowerCase().includes(s)) return false;}
        return true;
      }),[transactions,fProp,fType,fMonth,fStatus,search]);

      const sumInc = filtered.filter(tx=>tx.type==="income").reduce((s,tx)=>s+convertCur(tx.amount,tx.currency||'EUR',displayCur),0);
      const sumExp = filtered.filter(tx=>tx.type==="expense").reduce((s,tx)=>s+convertCur(tx.amount,tx.currency||'EUR',displayCur),0);
      const statusL = {paid:t('paid_l'),pending:t('pending_l'),overdue:t('overdue_l')};

      return (
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"18px",flexWrap:"wrap",gap:"12px"}}>
            <h2 style={{margin:0,color:"#e0e0ee",fontSize:"22px",fontWeight:"900",letterSpacing:"-0.02em"}}>{t('transactions')}</h2>
            <Btn onClick={onAdd} disabled={properties.length===0}>{t('new_txn')}</Btn>
          </div>
          <div className="filter-scroll" style={{marginBottom:"12px"}}>
            <Inp placeholder={t('search')} value={search} onChange={e=>set("search",e.target.value)} style={{minWidth:"130px",maxWidth:"160px",flex:"none"}}/>
            <Sel value={fProp} onChange={e=>set("fProp",e.target.value)} style={{minWidth:"160px",flex:"none"}}><option value="all">{t('all_props')}</option>{properties.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</Sel>
            <Sel value={fType} onChange={e=>set("fType",e.target.value)} style={{minWidth:"120px",flex:"none"}}><option value="all">{t('all_types')}</option><option value="income">{t('inc_filter')}</option><option value="expense">{t('exp_filter')}</option></Sel>
            <Sel value={fStatus} onChange={e=>set("fStatus",e.target.value)} style={{minWidth:"150px",flex:"none"}}><option value="all">{t('all_statuses')}</option><option value="paid">{t('paid_l')}</option><option value="pending">{t('pending_l')}</option><option value="overdue">{t('overdue_l')}</option></Sel>
            <Inp type="month" value={fMonth} onChange={e=>set("fMonth",e.target.value)} style={{minWidth:"155px",flex:"none"}}/>
            {hasFilters&&<button onClick={clearFilters} style={{background:"#d46b6b18",border:"1px solid #d46b6b33",color:"#d46b6b",borderRadius:"8px",padding:"8px 14px",cursor:"pointer",fontSize:"12px",fontWeight:"700",fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>✕ {t('clear_filters')}</button>}
          </div>
          <div style={{display:"flex",gap:"10px",marginBottom:"14px",flexWrap:"wrap"}}>
            {[{label:t('inc_filtered'),val:sumInc,color:"#6ec99a"},{label:t('exp_filtered'),val:sumExp,color:"#d46b6b"},{label:t('result'),val:sumInc-sumExp,color:sumInc-sumExp>=0?"#6ec99a":"#d46b6b"}].map(({label,val,color})=>(
              <div key={label} style={{...S.card,padding:"10px 14px",flex:1,minWidth:"120px"}}><span style={{color:"#5a5a78",fontSize:"10px",fontWeight:"700",textTransform:"uppercase",letterSpacing:"0.05em"}}>{label} </span><span style={{color,fontWeight:"900",fontSize:"14px"}}>{fCur(val,displayCur)}</span></div>
            ))}
          </div>
          <div style={S.card}>
            {filtered.length===0&&<p style={{color:"#5a5a78",textAlign:"center",padding:"48px 0",margin:0,fontSize:"14px"}}>{t('no_txn_filter')}</p>}
            {filtered.map((tx,i)=>{
              const prop = propMap[tx.property_id];
              const nights = tx.check_in&&tx.check_out?Math.round((new Date(tx.check_out)-new Date(tx.check_in))/86400000):null;
              const isInc = tx.type==="income";
              const statusColor = STATUS_C[tx.payment_status]||"#5a5a78";
              return (
                <div key={tx.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 0",borderBottom:i<filtered.length-1?"1px solid #1c1c2e":"none",gap:"10px"}}>
                  <div style={{width:"34px",height:"34px",borderRadius:"9px",flexShrink:0,background:(isInc?"#6ec99a":"#d46b6b")+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"15px"}}>{isInc?"💰":"🧾"}</div>
                  <div style={{flex:1,minWidth:0}}>
                    {/* #6 — badge now next to category label */}
                    <div style={{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap"}}>
                      <span style={{color:"#e0e0ee",fontSize:"13px",fontWeight:"700"}}>{tx.category||tx.description||t('no_cat')}</span>
                      <Badge color={statusColor} small>{statusL[tx.payment_status]||tx.payment_status}</Badge>
                    </div>
                    <div style={{color:"#5a5a78",fontSize:"11px",marginTop:"2px"}}>
                      {fDate(tx.date)}
                      {prop&&<span style={{color:prop.color}}> · {prop.name}</span>}
                      {tx.platform&&<span> · {tx.platform}</span>}
                      {nights!==null&&<span> · {nights} {t('nights')}</span>}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:"6px",alignItems:"center",flexShrink:0}}>
                    <span style={{color:isInc?"#6ec99a":"#d46b6b",fontWeight:"900",fontSize:"13px",minWidth:"75px",textAlign:"right"}}>
                      {isInc?"+":"−"}{fCur(convertCur(tx.amount,tx.currency||'EUR',displayCur),displayCur)}
                    </span>
                    <button onClick={()=>onEdit(tx)} style={{background:"none",border:"none",color:"#5a5a78",cursor:"pointer",padding:"3px",fontSize:"13px"}}>✏️</button>
                    <button onClick={()=>onDelete(tx)} style={{background:"none",border:"none",color:"#d46b6b88",cursor:"pointer",padding:"3px",fontSize:"13px"}}>🗑</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // SIDEBAR
    // ═══════════════════════════════════════════════════════════════
    const NAV = [
      { id:"dashboard",  icon:"📊" },
      { id:"monthly",    icon:"📋" },
      { id:"properties", icon:"🏠" },
      { id:"transactions",icon:"💳" },
    ];

    function Sidebar({ view, setView, user, onLogout, collapsed, setCollapsed, mobileOpen, setMobileOpen }) {
      const { t, lang, setLang } = useLang();
      const { displayCur, setDisplayCur } = useCur();
      const isMobile = useIsMobile();
      const expanded = isMobile || !collapsed;
      const inner = (
        <div style={{width:isMobile?"220px":(collapsed?"62px":"210px"),minHeight:"100vh",background:"#0c0c1e",borderRight:"1px solid #1c1c2e",display:"flex",flexDirection:"column",transition:"width 0.2s ease",flexShrink:0}}>
          <div style={{padding:expanded?"18px 16px":"18px 0",borderBottom:"1px solid #1c1c2e",display:"flex",alignItems:"center",justifyContent:expanded?"space-between":"center"}}>
            {expanded&&<div style={{color:"#c9956e",fontWeight:"900",fontSize:"14px",letterSpacing:"-0.02em"}}>🏠 RentaManager</div>}
            {!isMobile&&<button onClick={()=>setCollapsed(c=>!c)} style={{background:"none",border:"none",color:"#3a3a58",cursor:"pointer",fontSize:"16px",padding:"2px",lineHeight:1}}>{collapsed?"▶":"◀"}</button>}
            {isMobile&&<button onClick={()=>setMobileOpen(false)} style={{background:"none",border:"none",color:"#5a5a78",cursor:"pointer",fontSize:"20px",lineHeight:1}}>✕</button>}
          </div>
          <nav style={{flex:1,padding:"10px 8px"}}>
            {NAV.map(item=>{
              const active=view===item.id; const label=t(item.id);
              return <button key={item.id} onClick={()=>{setView(item.id);if(isMobile)setMobileOpen(false);}} style={{display:"flex",alignItems:"center",gap:"10px",width:"100%",padding:"10px 10px",borderRadius:"8px",border:"none",cursor:"pointer",fontFamily:"inherit",background:active?"#c9956e18":"transparent",color:active?"#c9956e":"#4a4a68",fontSize:"13px",fontWeight:active?"800":"500",marginBottom:"2px",textAlign:"left",transition:"all 0.15s",justifyContent:expanded?"flex-start":"center"}} title={!expanded?label:""}><span style={{fontSize:"17px",flexShrink:0}}>{item.icon}</span>{expanded&&<span>{label}</span>}</button>;
            })}
          </nav>
          <div style={{padding:"10px 12px",borderTop:"1px solid #1c1c2e"}}>
            {expanded&&<>
              <p style={{...S.label,marginBottom:"8px"}}>{t('language')}</p>
              <div style={{display:"flex",gap:"4px",marginBottom:"12px"}}>
                {['es','en','pl'].map(l=><button key={l} onClick={()=>setLang(l)} style={{flex:1,padding:"5px 4px",borderRadius:"6px",border:`1.5px solid ${lang===l?"#a06bd4":"#a06bd433"}`,cursor:"pointer",fontSize:"14px",fontFamily:"inherit",background:"#a06bd466",outline:lang===l?"2px solid #a06bd4":"none",outlineOffset:"1px"}}>{FLAGS[l]}</button>)}
              </div>
              <p style={{...S.label,marginBottom:"8px"}}>{t('display_cur')}</p>
              <Sel value={displayCur} onChange={e=>{setDisplayCur(e.target.value);localStorage.setItem('rm_cur',e.target.value);}} style={{marginBottom:"4px",fontSize:"12px",padding:"7px 10px",color:"#6ec99a",borderColor:"#6ec99a44"}}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</Sel>
              <p style={{color:"#3a3a58",fontSize:"10px",margin:"0 0 10px"}}>{t('approx')}</p>
            </>}
            {expanded&&user&&<div style={{padding:"8px 2px",marginBottom:"4px"}}><div style={{color:"#e0e0ee",fontSize:"12px",fontWeight:"700",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.user_metadata?.full_name||user.email?.split("@")[0]}</div><div style={{color:"#3a3a58",fontSize:"10px",overflow:"hidden",textOverflow:"ellipsis"}}>{user.email}</div></div>}
            <button onClick={onLogout} style={{display:"flex",alignItems:"center",gap:"10px",width:"100%",padding:"10px 2px",borderRadius:"8px",border:"none",cursor:"pointer",fontFamily:"inherit",background:"transparent",color:"#3a3a58",fontSize:"13px",textAlign:"left",transition:"all 0.15s",justifyContent:expanded?"flex-start":"center"}}>
              <span style={{fontSize:"17px"}}>🚪</span>{expanded&&<span>{t('logout')}</span>}
            </button>
          </div>
        </div>
      );
      if(isMobile) return mobileOpen?(<><div className="mobile-sidebar-overlay" onClick={()=>setMobileOpen(false)}/><div style={{position:"fixed",left:0,top:0,bottom:0,zIndex:300}}>{inner}</div></>):null;
      return inner;
    }

    // ═══════════════════════════════════════════════════════════════
    // MAIN APP — lifted state for persistence (#3)
    // ═══════════════════════════════════════════════════════════════
    function MainApp({ db, user, onLogout }) {
      const { t } = useLang();
      const isMobile = useIsMobile();
      const [view,setView] = useState("dashboard");
      const [props,setProps] = useState([]);
      const [txns,setTxns] = useState([]);
      const [visibleIds,setVisibleIds] = useState([]);
      const [collapsed,setCollapsed] = useState(false);
      const [mobileOpen,setMobileOpen] = useState(false);
      const [loading,setLoading] = useState(true);

      // Persistent state (#3)
      const [period,setPeriod] = useState(nowStr);
      const [chartMonths,setChartMonths] = useState(6);
      const [txnFilters,setTxnFilters] = useState({fProp:"all",fType:"all",fMonth:"",fStatus:"all",search:""});

      const [propModal,setPropModal] = useState(null);
      const [propError,setPropError] = useState("");
      const [txnModal,setTxnModal] = useState(null);
      const [delItem,setDelItem] = useState(null);

      const loadAll = useCallback(async()=>{
        const [propList]=await db.props.list();
        const pl=propList||[];
        setProps(pl);
        setVisibleIds(prev=>{const allIds=pl.map(p=>p.id);const f=prev.filter(id=>allIds.includes(id));return f.length>0?f:allIds;});
        if(pl.length>0){const [tList]=await db.txns.list(pl.map(p=>p.id));setTxns(tList||[]);}else{setTxns([]);}
        setLoading(false);
      },[db]);

      useEffect(()=>{loadAll();},[loadAll]);
      useEffect(()=>{const timer=setInterval(loadAll,30000);return()=>clearInterval(timer);},[loadAll]);

      const saveProp = async(form)=>{
        setPropError("");
        const data={name:form.name.trim(),location:form.location,type:form.type,currency:form.currency,color:form.color,sqm:form.sqm?+form.sqm:null,notes:form.notes};
        const [,err]=form.id?await db.props.update(form.id,data):await db.props.create(data);
        if(err){setPropError(err);return;}
        setPropModal(null);setPropError("");await loadAll();
      };

      const deleteProp = async()=>{if(!delItem)return;await db.props.del(delItem.id);setDelItem(null);await loadAll();};

      const saveTxn = async(form, dupIncomeStatus = null)=>{
        const data={property_id:form.property_id,type:form.type,category:form.category||null,amount:+form.amount,currency:form.currency,date:form.date,description:form.description||null,platform:form.platform||null,check_in:form.check_in||null,check_out:form.check_out||null,payment_status:form.payment_status,notes:form.notes||null};
        if(form.id) await db.txns.update(form.id,data); else await db.txns.create(data);
        // Create paired income if requested
        if(dupIncomeStatus && form.type==="expense" && !form.id){
          const incomeData={...data, type:"income", payment_status:dupIncomeStatus, notes:form.notes||null};
          await db.txns.create(incomeData);
        }
        setTxnModal(null);await loadAll();
      };

      // Bulk save (#5)
      const saveBulk = async(form, months, year, dupIncomeStatus = null)=>{
        for(const m of months){
          const date=`${year}-${String(m).padStart(2,"0")}-01`;
          const data={property_id:form.property_id,type:form.type,category:form.category||null,amount:+form.amount,currency:form.currency,date,description:form.description||null,platform:form.platform||null,check_in:null,check_out:null,payment_status:form.payment_status,notes:form.notes||null};
          await db.txns.create(data);
          if(dupIncomeStatus && form.type==="expense"){
            const incomeData={...data,type:"income",payment_status:dupIncomeStatus};
            await db.txns.create(incomeData);
          }
        }
        setTxnModal(null);await loadAll();
      };

      const deleteTxn = async()=>{if(!delItem)return;await db.txns.del(delItem.id);setDelItem(null);await loadAll();};

      return (
        <div style={{display:"flex",minHeight:"100vh",background:"#07070f"}}>
          {isMobile&&(
            <div style={{position:"fixed",top:0,left:0,right:0,height:"52px",background:"#0c0c1e",borderBottom:"1px solid #1c1c2e",display:"flex",alignItems:"center",padding:"0 16px",zIndex:100,gap:"12px"}}>
              <button onClick={()=>setMobileOpen(true)} style={{background:"none",border:"none",color:"#c9956e",fontSize:"22px",cursor:"pointer",lineHeight:1,padding:0}}>☰</button>
              <span style={{color:"#c9956e",fontWeight:"900",fontSize:"14px"}}>🏠 RentaManager</span>
              <div style={{flex:1}}/>
              {NAV.map(item=><button key={item.id} onClick={()=>setView(item.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:"19px",opacity:view===item.id?1:0.35,padding:"4px",lineHeight:1}}>{item.icon}</button>)}
            </div>
          )}
          <Sidebar view={view} setView={setView} user={user} onLogout={onLogout} collapsed={collapsed} setCollapsed={setCollapsed} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
          <div style={{flex:1,padding:isMobile?"68px 16px 24px":"28px 32px",overflowY:"auto",minWidth:0}}>
            {loading?(
              <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"200px",color:"#3a3a58",fontSize:"14px"}}>{t('loading')}</div>
            ):(
              <>
                {view==="dashboard"&&<DashboardView properties={props} transactions={txns} visibleIds={visibleIds} setVisibleIds={setVisibleIds} period={period} setPeriod={setPeriod} chartMonths={chartMonths} setChartMonths={setChartMonths}/>}
                {view==="monthly"&&<MonthlyView properties={props} transactions={txns} visibleIds={visibleIds} period={period} setPeriod={setPeriod}/>}
                {view==="properties"&&<PropertiesView properties={props} db={db} onAdd={()=>setPropModal({})} onEdit={p=>setPropModal(p)} onDelete={p=>setDelItem({...p,_type:"prop"})}/>}
                {view==="transactions"&&<TransactionsView transactions={txns} properties={props} filters={txnFilters} setFilters={setTxnFilters} onAdd={()=>props.length===0?setView("properties"):setTxnModal({})} onEdit={tx=>setTxnModal(tx)} onDelete={tx=>setDelItem({...tx,_type:"txn"})}/>}
              </>
            )}
          </div>
          {propModal!==null&&<PropertyModal prop={propModal} onSave={saveProp} error={propError} onClose={()=>{setPropModal(null);setPropError("");}}/>}
          {txnModal!==null&&props.length>0&&<TxnModal txn={txnModal} properties={props} onSave={saveTxn} onSaveBulk={saveBulk} onClose={()=>setTxnModal(null)}/>}
          {delItem&&(
            <Modal title={t('confirm_del')} onClose={()=>setDelItem(null)} width="400px">
              <p style={{color:"#7070a0",marginTop:0,lineHeight:"1.6",fontSize:"14px"}}>{t('del_msg')} <strong style={{color:"#e0e0ee"}}>{delItem.name||delItem.category||t('this_txn')}</strong>{t('del_q')}{delItem._type==="prop"&&<span style={{color:"#d46b6b"}}>{t('will_del_txns')}</span>}</p>
              <div style={{display:"flex",gap:"10px",justifyContent:"flex-end"}}><Btn variant="ghost" onClick={()=>setDelItem(null)}>{t('cancel')}</Btn><Btn variant="danger" onClick={delItem._type==="prop"?deleteProp:deleteTxn}>{t('del_confirm')}</Btn></div>
            </Modal>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // ROOT
    // ═══════════════════════════════════════════════════════════════
    function App() {
      const [lang,setLang] = useState(localStorage.getItem('rm_lang')||'es');
      const [displayCur,setDisplayCur] = useState(localStorage.getItem('rm_cur')||'EUR');
      const [screen,setScreen] = useState("auth");
      const [user,setUser] = useState(null);
      const [db] = useState(()=>makeDB(SUPABASE_URL,SUPABASE_KEY));
      const setLangP = (l)=>{setLang(l);localStorage.setItem('rm_lang',l);};
      const t = (k) => T[lang]?.[k]??k;
      return (
        <LangCtx.Provider value={{t,lang,setLang:setLangP}}>
          <CurCtx.Provider value={{displayCur,setDisplayCur}}>
            {screen==="auth"?<AuthScreen db={db} onLogin={u=>{setUser(u);setScreen("app");}}/>:<MainApp db={db} user={user} onLogout={()=>{db.auth.logout();setUser(null);setScreen("auth");}}/>}
          </CurCtx.Provider>
        </LangCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
